name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check browser JavaScript syntax
        run: |
          node --input-type=module --check < webapp/webmcp.js
          node --input-type=module --check < webapp/app.js
          node --input-type=module --check < webapp/dependencies-ui.js

      - name: Test
        run: pytest -q
